<style>
:root{
  --bg:#f3f6f8;        /* vidrio */
  --surface:#ffffff;
  --ink:#13263d;       /* azul noche */
  --muted:#4f6277;
  --line:#d3dde6;
  --court:#1d4f91;     /* azul cancha */
  --court-soft:#e3ecf7;
  --turf:#2f7d5b;      /* césped */
  --ball:#dfee5a;      /* pelota */
  --ball-ink:#1d2a05;
  --radius:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a2a; --surface:#13243a; --ink:#e7eef6; --muted:#9db0c4; --line:#24384f;
    --court:#7fb0f0; --court-soft:#1a3150; --turf:#6fc69c; --ball:#dfee5a; --ball-ink:#1d2a05;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1a2a; --surface:#13243a; --ink:#e7eef6; --muted:#9db0c4; --line:#24384f;
  --court:#7fb0f0; --court-soft:#1a3150; --turf:#6fc69c; --ball:#dfee5a; --ball-ink:#1d2a05;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--court);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--court);outline-offset:3px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
@media (max-width:600px){.wrap{padding:0 16px}}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;color:var(--ink)}
.mark svg{flex:none}
.top-actions{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{all:unset;cursor:pointer;font-size:14px;font-weight:600;padding:5px 12px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.icon-btn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}

/* hero */
.hero{padding:48px 0 28px}
.hero h1{font-size:clamp(44px,8vw,92px);line-height:.95;letter-spacing:-.035em;font-weight:800;margin:0}
.hero .role{font-size:clamp(20px,2.6vw,28px);font-weight:500;color:var(--muted);margin:18px 0 0;max-width:30ch;line-height:1.25}
.hero .role strong{color:var(--ink);font-weight:600}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:15px;color:var(--muted)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--turf);box-shadow:0 0 0 4px color-mix(in srgb,var(--turf) 22%,transparent)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1a2a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1a2a}}
.btn:hover{border-color:var(--court)}

/* the booking board */
.board{margin:44px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px}
.board-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:34px}
.board-head h2{font-size:18px;margin:0;font-weight:700}
.board-head p{margin:0;font-size:14px;color:var(--muted)}
.grid{position:relative;display:grid;grid-template-columns:132px minmax(0,1fr);row-gap:8px}
.lane-label{font-size:14px;font-weight:600;color:var(--muted);align-self:center}
.lane{position:relative;height:46px;border-radius:6px;
  background:
    repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%),
    var(--court-soft)}
.slot{position:absolute;top:5px;bottom:5px;border-radius:5px;display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap;overflow:hidden;color:#fff;background:var(--court);transform-origin:left;}
.slot.edu{background:var(--muted)}
.slot.own{background:var(--ball);color:var(--ball-ink)}
.slot.live::after{content:"";position:absolute;right:0;top:0;bottom:0;width:18px;background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.35) 4px 7px)}
.slot.own.live::after{background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(0,0,0,.18) 4px 7px)}
:root[data-theme="dark"] .slot:not(.own){color:#0d1a2a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .slot:not(.own){color:#0d1a2a}}
.slot:hover,.slot:focus-visible{filter:brightness(1.08)}
.years{grid-column:2;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.years span{padding-left:4px}
.now{position:absolute;top:-6px;bottom:22px;width:2px;background:var(--ink);pointer-events:none}
.now b{position:absolute;top:-20px;right:-1px;font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);padding:1px 7px;border-radius:999px;white-space:nowrap}
@keyframes book{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.slot{animation:book .7s cubic-bezier(.2,.7,.2,1) both}
.lane:nth-of-type(2) .slot{animation-delay:.15s}
@media (max-width:720px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .lane-label{margin-top:6px}
  .years{grid-column:1}
  .years span:nth-child(even){visibility:hidden}
  .slot{font-size:12.5px;padding:0 7px}
  .board{padding:18px 14px 14px}
}

/* sections */
section{padding:56px 0;border-top:1px solid var(--line)}
section > .wrap > h2,.sec-title{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1.1;margin:0 0 28px;font-weight:800}
.lead{font-size:19px;max-width:62ch;margin:0}
.two{display:grid;grid-template-columns:260px 1fr;gap:28px}

.job{display:grid;grid-template-columns:260px 1fr;gap:28px;padding:26px 0;border-top:1px solid var(--line)}
.job:first-of-type{border-top:0;padding-top:0}
.job h3{margin:0;font-size:22px;letter-spacing:-.01em}
.job .where{margin:4px 0 0;color:var(--muted);font-size:15px}
.job .when{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.job ul{margin:0;padding-left:18px;max-width:66ch}
.job li{margin:0 0 8px}
.job li::marker{color:var(--court)}
@media (max-width:820px){.job{grid-template-columns:1fr;gap:10px}}

/* CentralTurnos feature */
.ct{background:var(--court);color:#fff;border-radius:16px;padding:38px;display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:start}
:root[data-theme="dark"] .ct{background:#183a66}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ct{background:#183a66}}
.ct h2{font-size:clamp(32px,5vw,52px);margin:0;letter-spacing:-.03em;line-height:1;font-weight:800}
.ct .sub{margin:14px 0 22px;font-size:18px;opacity:.9;max-width:40ch}
.ct .facts{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.ct .facts li{padding-left:22px;position:relative}
.ct .facts li::before{content:"";position:absolute;left:0;top:.5em;width:10px;height:10px;border-radius:50%;background:var(--ball)}
.ct .btn{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.ct .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.ct .tech{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.ct .tech span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
@media (max-width:820px){.ct{grid-template-columns:1fr;padding:26px 20px;gap:24px}}

/* services */
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.service{padding:24px}
.service + .service{border-left:1px solid var(--line)}
.service h3{margin:0 0 8px;font-size:19px}
.service p{margin:0;color:var(--muted);font-size:16px}
@media (max-width:820px){.services{grid-template-columns:1fr}.service + .service{border-left:0;border-top:1px solid var(--line)}}

/* skills */
.skills{display:grid;grid-template-columns:200px 1fr;gap:0;margin:0}
.skills dt,.skills dd{padding:14px 0;border-top:1px solid var(--line);margin:0}
.skills dt{font-weight:700;font-size:15px}
.skills dd{color:var(--muted)}
.skills dd b{color:var(--ink);font-weight:600}
@media (max-width:640px){.skills{grid-template-columns:1fr}.skills dd{border-top:0;padding-top:0}}

.ai p{max-width:64ch;margin:0 0 14px}
.langs{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}
.langs div{min-width:220px}
.langs b{display:block}
.langs span{color:var(--muted);font-size:15px}

/* contact */
.contact h2{font-size:clamp(34px,6vw,64px)!important;letter-spacing:-.03em}
.contact-list{display:flex;flex-wrap:wrap;gap:10px}
footer{padding:28px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
</style>

// Booking board data: months since Jan 2017 (0) to Dec 2026 (119)
const START = 2017, SPAN = 120;
const m = (y, mo) => (y - START) * 12 + (mo - 1);
const NOW = (() => { const d = new Date(); return Math.min(SPAN - 1, m(d.getFullYear(), d.getMonth() + 1)); })();
const SLOTS = [
  {lane:"laneWork", id:"coop",    label:"Coop.",  from:m(2019,9),  to:m(2019,11)},
  {lane:"laneWork", id:"bitsion", label:"Bitsion", from:m(2020,3), to:m(2023,4)},
  {lane:"laneWork", id:"itr",     label:"ITR · Trenes Argentinos", from:m(2023,5), to:NOW, live:true},
  {lane:"laneOwn",  id:"centralturnos", label:"CentralTurnos", from:m(2024,1), to:NOW, live:true, cls:"own"},
  {lane:"laneEdu",  id:"perfil-edu", label:"Técnico Sup.", labelEn:"Software Dev. degree", from:m(2017,1), to:m(2019,12), cls:"edu", href:"#ia"}
];

function setLang(lang){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dataset.lang = lang;
  document.title = t.title;
  document.querySelectorAll("[data-k]").forEach(el => { const v = t[el.dataset.k]; if (typeof v === "string") el.innerHTML = v; });
  document.querySelectorAll("[data-set-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.setLang === lang));
  document.getElementById("pdfBtn").href = t.pdf;
  document.getElementById("pdfBtn2").href = t.pdf;
  document.getElementById("themeBtn").setAttribute("aria-label", t.theme);

  // jobs
  document.getElementById("jobs").innerHTML = t.jobs.map(j => `
    <article class="job" id="${j.id}">
      <div><h3>${j.t}</h3><p class="where">${j.r}<br>${j.w}</p><p class="when">${j.d}</p></div>
      <ul>${j.b.map(x => `<li>${x}</li>`).join("")}</ul>
    </article>`).join("");
  document.getElementById("ctFacts").innerHTML = t.ctFacts.map(x => `<li>${x}</li>`).join("");
  document.getElementById("services").innerHTML = t.services.map(s => `<div class="service"><h3>${s.h}</h3><p>${s.p}</p></div>`).join("");
  document.getElementById("skills").innerHTML = t.skills.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");

  // board
  ["laneWork","laneOwn","laneEdu"].forEach(id => document.getElementById(id).innerHTML = "");
  SLOTS.forEach(s => {
    const a = document.createElement("a");
    a.className = "slot " + (s.cls || "") + (s.live ? " live" : "");
    a.href = s.href || "#" + s.id;
    const label = lang === "en" && s.labelEn ? s.labelEn : s.label;
    a.textContent = (s.to - s.from) >= 8 ? label : "";
    a.title = label;
    a.setAttribute("aria-label", label);
    a.style.left = (s.from / SPAN * 100) + "%";
    a.style.width = ((s.to - s.from + 1) / SPAN * 100) + "%";
    document.getElementById(s.lane).appendChild(a);
  });
  let now = document.querySelector(".now");
  if (!now) { now = document.createElement("div"); now.className = "now"; now.innerHTML = "<b></b>"; document.getElementById("grid").appendChild(now); }
  now.querySelector("b").textContent = t.now;
  positionNow();
  try { localStorage.setItem("lang", lang); } catch(e) {}
}
function positionNow(){
  const lane = document.getElementById("laneWork"), grid = document.getElementById("grid"), now = document.querySelector(".now");
  if (!now) return;
  const gx = grid.getBoundingClientRect().left, lr = lane.getBoundingClientRect();
  now.style.left = (lr.left - gx + lr.width * ((NOW + 1) / SPAN)) + "px";
}
window.addEventListener("resize", positionNow);

document.querySelectorAll("[data-set-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.setLang)));
document.getElementById("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const isDark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = isDark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch(e) {}
});

(function init(){
  let lang = new URLSearchParams(location.search).get("lang");
  try { lang = lang || localStorage.getItem("lang"); const th = localStorage.getItem("theme"); if (th) document.documentElement.dataset.theme = th; } catch(e) {}
  if (!T[lang]) lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
  setLang(lang);
})();
</script>
